[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "macroetym"
version = "0.1.3"
authors = [
  { name="Jonathan Reeve", email="jonathan@jonreeve.com" },
]
description = "A tool for macro-etymological textual analysis."
readme = "README.md"
requires-python = ">=3.8"
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: GPLv3",
    "Operating System :: OS Independent",
]
dependencies = [
    "Click",
    "nltk",
    "pycountry",
    "pandas>=2.0.0",
    "matplotlib",
]
keywords = ["nlp", "text-analysis", "etymology"]

[project.urls]
"Homepage" = "https://github.com/JonathanReeve/macro-etym"
"Download" = "https://github.com/JonathanReeve/macro-etym/tarball/0.1.2"

[project.scripts]
macroetym = "macroetym.main:cli"

[tool.setuptools.packages.find]
where = ["."]

[tool.setuptools]
include-package-data = true
package-data = {"macroetym" = ["etymwn-smaller.tsv"]}
